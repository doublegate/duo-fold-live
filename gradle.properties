# Fork build tuning (audit 6.7; measured: one-file change + assembleFold7test 33 s -> 15.5 s on a 10-core desktop).
# Kotlin incremental compilation + compiler daemon instead of full in-process recompiles; worker count left at
# Gradle's default (number of CPU cores) so small CI runners are not oversubscribed. File-system watching stays
# at Gradle's default: forcing it on is unsupported on network shares (the NAS dev container builds from one).
# Upstream ships kotlin.incremental=false / in-process / workers.max=3 / -Xmx3g; keep this file out of upstream PRs.
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
org.gradle.parallel=true
org.gradle.caching=true
kotlin.incremental=true
kotlin.compiler.execution.strategy=daemon
